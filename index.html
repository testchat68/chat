<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моят Чат</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <div class="flex h-screen">
    <div class="w-80 border-r border-gray-800 bg-gray-900 flex flex-col">
      <div class="p-4 border-b border-gray-800 flex items-center gap-3 bg-gray-900">
        <i class="fas fa-comments text-2xl text-blue-500"></i>
        <h1 class="text-xl font-bold">Съобщения</h1>
      </div>
      <div class="p-4 text-center text-gray-400 text-sm">
        Всички са в една обща чат стая
      </div>
    </div>

    <div class="flex-1 flex flex-col">
      <div class="p-4 border-b border-gray-800 flex items-center gap-3 bg-gray-900">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-2xl">💬</div>
        <div>
          <h2 class="font-semibold">Обща чат стая</h2>
          <p class="text-xs text-green-500">Онлайн чат</p>
        </div>
      </div>

      <div id="messages" class="flex-1 p-4 overflow-y-auto bg-gray-950 space-y-4"></div>

      <div class="p-4 bg-gray-900 border-t border-gray-800">
        <div class="flex gap-2">
  <input type="text" id="username" value="Аз" class="w-32 ...">
  <input type="text" id="message-input" class="flex-1 ..." placeholder="Напиши съобщение...">
  
  <button onclick="uploadImage()" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-full">
    📷
  </button>
  
  <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 px-8 rounded-full">Изпрати</button>
</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXBkRNIxckOGfdZcJuaAx-xA4r78bkitQ",
      authDomain: "pi-chat-85f23.firebaseapp.com",
      databaseURL: "https://pi-chat-85f23-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pi-chat-85f23",
      storageBucket: "pi-chat-85f23.firebasestorage.app",
      messagingSenderId: "427213769208",
      appId: "1:427213769208:web:aa3b0ecbbf5840cbfd6e0d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('messages');
    const storage = firebase.storage();

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('message-input');
    const usernameInput = document.getElementById('username');

    function addMessage(snapshot) {
      const data = snapshot.val();
      const messageId = snapshot.key;
      if (!data) return;

      const isMine = data.username === usernameInput.value;

      let content = '';
      if (data.imageUrl) {
        content = `<img src="${data.imageUrl}" class="max-w-xs rounded-xl mt-2 cursor-pointer" onclick="window.open('${data.imageUrl}', '_blank')">`;
      } else if (data.text) {
        content = `<p class="mt-1">${data.text}</p>`;
      }

      const msg = document.createElement('div');
      msg.className = `flex ${isMine ? 'justify-end' : 'justify-start'} group`;
      msg.innerHTML = `
        <div class="${isMine ? 'bg-blue-600' : 'bg-gray-700'} max-w-md px-4 py-3 rounded-2xl rounded-${isMine ? 'tr' : 'tl'}-none relative">
          <p class="text-xs opacity-75">${data.username}</p>
          ${content}
          <p class="text-[10px] text-right mt-1 opacity-60">${new Date(data.timestamp).toLocaleTimeString('bg-BG', {hour:'2-digit', minute:'2-digit'})}</p>
          
          ${isMine ? `
          <button onclick="deleteMessage('${messageId}')" 
                  class="absolute -top-2 -right-2 bg-red-600 hover:bg-red-700 text-white text-xs w-5 h-5 rounded-full hidden group-hover:flex items-center justify-center">
            ✕
          </button>` : ''}
        </div>
      `;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    messagesRef.on('child_added', (snapshot) => addMessage(snapshot));

    function sendMessage() {
      const text = input.value.trim();
      if (text) {
        messagesRef.push({
          username: usernameInput.value || "Анонимен",
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    // Качване на снимка
    window.uploadImage = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;

        const storageRef = storage.ref('chat-images/' + Date.now() + '-' + file.name);
        
        storageRef.put(file).then(snapshot => {
          snapshot.ref.getDownloadURL().then(url => {
            messagesRef.push({
              username: usernameInput.value || "Анонимен",
              imageUrl: url,
              timestamp: Date.now()
            });
          });
        });
      };
      input.click();
    };

    window.deleteMessage = function(messageId) {
      if (confirm("Изтрий съобщението?")) {
        db.ref('messages/' + messageId).remove();
      }
    };

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
